<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:        #0a0a0f;
  --surface:   #111118;
  --surface2:  #1a1a26;
  --border:    #ffffff0f;
  --border2:   #ffffff1a;
  --accent:    #7c6cfc;
  --accent2:   #a78bfa;
  --accent-glow: #7c6cfc40;
  --green:     #34d399;
  --yellow:    #fbbf24;
  --red:       #f87171;
  --blue:      #60a5fa;
  --text:      #f0f0ff;
  --text2:     #9090b0;
  --text3:     #5a5a7a;
  --r:         12px;
  --r2:        8px;
  --font-head: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── NOISE OVERLAY ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  opacity: 0.4;
}

/* ── AUTH SCREEN ── */
#auth-screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
}
#auth-screen::after {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, #7c6cfc18 0%, transparent 70%);
  top: 50%; left: 50%; transform: translate(-50%, -60%);
  pointer-events: none;
}
.auth-card {
  width: 100%; max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 44px 40px;
  position: relative; z-index: 1;
  animation: slideUp 0.5s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.auth-logo {
  font-family: var(--font-head);
  font-size: 28px; font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
}
.auth-logo span { color: var(--accent2); }
.auth-sub { color: var(--text2); font-size: 14px; margin-bottom: 32px; }
.auth-tabs {
  display: flex; gap: 4px;
  background: var(--bg);
  border-radius: var(--r2);
  padding: 4px;
  margin-bottom: 28px;
}
.auth-tab {
  flex: 1; padding: 8px;
  border: none; border-radius: 6px;
  background: transparent;
  color: var(--text2);
  font-family: var(--font-body);
  font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
}
.auth-tab.active { background: var(--surface2); color: var(--text); }

.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
.field input {
  width: 100%; padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: var(--r2);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none; transition: border-color 0.2s;
}
.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--text3); }

.btn-primary {
  width: 100%; padding: 13px;
  background: var(--accent);
  border: none; border-radius: var(--r2);
  color: #fff;
  font-family: var(--font-head);
  font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  margin-top: 8px;
  position: relative; overflow: hidden;
}
.btn-primary::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, #fff2 0%, transparent 50%);
  pointer-events: none;
}
.btn-primary:hover { background: #6a5ae0; transform: translateY(-1px); box-shadow: 0 8px 24px var(--accent-glow); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.auth-error { color: var(--red); font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }

/* ── MAIN APP ── */
#app { display: none; min-height: 100vh; }
#app.visible { display: flex; flex-direction: column; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ── HEADER ── */
header {
  position: sticky; top: 0; z-index: 50;
  background: #0a0a0fcc;
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-logo {
  font-family: var(--font-head);
  font-size: 20px; font-weight: 800;
  display: flex; align-items: center; gap: 8px;
}
.header-logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); display: inline-block; }
.header-right { display: flex; align-items: center; gap: 16px; }
.user-pill {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 6px 14px 6px 8px;
  font-size: 13px; color: var(--text2);
}
.user-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  font-family: var(--font-head);
}
.btn-logout {
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: var(--r2);
  color: var(--text2);
  font-family: var(--font-body);
  font-size: 13px; padding: 7px 14px;
  cursor: pointer; transition: all 0.2s;
}
.btn-logout:hover { border-color: var(--red); color: var(--red); }

/* ── MAIN CONTENT ── */
main { flex: 1; padding: 40px 32px; max-width: 1200px; width: 100%; margin: 0 auto; }

/* ── STATS ROW ── */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 40px; }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px 24px;
  position: relative; overflow: hidden;
  transition: border-color 0.2s, transform 0.2s;
  cursor: default;
}
.stat-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--card-accent, var(--accent));
  opacity: 0;
  transition: opacity 0.2s;
}
.stat-card:hover { border-color: var(--border2); transform: translateY(-2px); }
.stat-card:hover::before { opacity: 1; }
.stat-label { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.stat-value { font-family: var(--font-head); font-size: 36px; font-weight: 700; line-height: 1; color: var(--text); }
.stat-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 32px; opacity: 0.15; }

/* ── TOOLBAR ── */
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.toolbar-left { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }

.filter-btn {
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 100px;
  color: var(--text2);
  font-family: var(--font-body);
  font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
  white-space: nowrap;
}
.filter-btn:hover { border-color: var(--border2); color: var(--text); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.search-wrap { position: relative; }
.search-wrap input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 8px 16px 8px 38px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px; width: 220px; outline: none;
  transition: border-color 0.2s, width 0.3s;
}
.search-wrap input:focus { border-color: var(--border2); width: 280px; }
.search-wrap::before {
  content: '⌕'; position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  color: var(--text3); font-size: 16px; pointer-events: none;
}

.btn-new {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 20px;
  background: var(--accent);
  border: none; border-radius: 100px;
  color: #fff;
  font-family: var(--font-head);
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  white-space: nowrap;
}
.btn-new:hover { background: #6a5ae0; box-shadow: 0 4px 20px var(--accent-glow); transform: translateY(-1px); }

/* ── TASK GRID ── */
.tasks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.task-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  animation: cardIn 0.3s ease backwards;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.task-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 12px 40px #0006; }
.task-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.task-title { font-family: var(--font-head); font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.4; flex: 1; }
.task-title.done { text-decoration: line-through; color: var(--text3); }
.task-desc { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.task-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.task-tags { display: flex; gap: 6px; flex-wrap: wrap; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 100px;
  font-size: 11px; font-weight: 500; letter-spacing: 0.02em;
}
.badge-todo    { background: #ffffff10; color: var(--text2); }
.badge-progress{ background: #fbbf2420; color: var(--yellow); }
.badge-done    { background: #34d39920; color: var(--green); }
.badge-low     { background: #60a5fa15; color: var(--blue); }
.badge-medium  { background: #fbbf2415; color: var(--yellow); }
.badge-high    { background: #f8717115; color: var(--red); }

.task-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s; }
.task-card:hover .task-actions { opacity: 1; }
.icon-btn {
  width: 30px; height: 30px;
  border-radius: 8px; border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text2); font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s;
}
.icon-btn:hover { background: var(--surface); color: var(--text); }
.icon-btn.del:hover { border-color: var(--red); color: var(--red); background: #f8717110; }

.due-date { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 4px; }
.due-date.overdue { color: var(--red); }

/* ── EMPTY STATE ── */
.empty {
  grid-column: 1 / -1;
  text-align: center; padding: 80px 20px;
  color: var(--text3);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty h3 { font-family: var(--font-head); font-size: 20px; color: var(--text2); margin-bottom: 8px; }
.empty p { font-size: 14px; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: #000000b0;
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 18px;
  padding: 32px;
  width: 100%; max-width: 480px;
  transform: scale(0.96) translateY(10px);
  transition: transform 0.25s ease;
}
.modal-overlay.open .modal { transform: scale(1) translateY(0); }
.modal-title {
  font-family: var(--font-head);
  font-size: 20px; font-weight: 700;
  margin-bottom: 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-close {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text2); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.modal-close:hover { border-color: var(--border2); color: var(--text); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: var(--r2);
  padding: 10px 12px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px; outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group select option { background: var(--surface2); }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
.btn-cancel {
  padding: 10px 20px; border-radius: var(--r2);
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2); font-family: var(--font-body);
  font-size: 14px; cursor: pointer; transition: all 0.2s;
}
.btn-cancel:hover { border-color: var(--text3); color: var(--text); }
.btn-save {
  padding: 10px 24px; border-radius: var(--r2);
  border: none; background: var(--accent);
  color: #fff; font-family: var(--font-head);
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.btn-save:hover { background: #6a5ae0; }
.btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 28px; right: 28px; z-index: 999;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  padding: 14px 20px;
  font-size: 14px; color: var(--text);
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 16px 40px #0008;
  transform: translateY(10px); opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success .toast-icon { color: var(--green); }
.toast.error   .toast-icon { color: var(--red); }

/* ── LOADING ── */
.loader { display: inline-block; width: 18px; height: 18px; border: 2px solid #ffffff30; border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── COLUMNS VIEW ── */
.kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.kanban-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.kanban-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.kanban-title { font-family: var(--font-head); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.kanban-count { background: var(--bg); border: 1px solid var(--border); border-radius: 100px; font-size: 11px; padding: 1px 8px; color: var(--text2); }
.kanban-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; }
.kanban-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r2); padding: 14px; cursor: pointer; transition: all 0.15s; }
.kanban-card:hover { border-color: var(--border2); }
.kanban-card-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 8px; line-height: 1.4; }
.kanban-card-title.done { text-decoration: line-through; color: var(--text3); }
.kanban-card-foot { display: flex; align-items: center; justify-content: space-between; }

/* ── VIEW TOGGLE ── */
.view-toggle { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r2); padding: 3px; }
.view-btn { width: 30px; height: 26px; border: none; border-radius: 6px; background: transparent; color: var(--text3); cursor: pointer; font-size: 14px; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
.view-btn.active { background: var(--surface2); color: var(--text); }

@media (max-width: 768px) {
  header { padding: 0 16px; }
  main { padding: 24px 16px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .kanban { grid-template-columns: 1fr; }
  .tasks-grid { grid-template-columns: 1fr; }
  .search-wrap input { width: 160px; }
  .search-wrap input:focus { width: 200px; }
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">Task<span>Flow</span></div>
    <p class="auth-sub">Manage your work, beautifully.</p>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchTab('register')">Register</button>
    </div>
    <div id="login-form">
      <div class="field"><label>Username</label><input id="login-user" type="text" placeholder="your username" autocomplete="username"/></div>
      <div class="field"><label>Password</label><input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
      <button class="btn-primary" onclick="doLogin()">Sign In</button>
    </div>
    <div id="register-form" style="display:none">
      <div class="field"><label>Username</label><input id="reg-user" type="text" placeholder="choose a username"/></div>
      <div class="field"><label>Email</label><input id="reg-email" type="email" placeholder="you@example.com"/></div>
      <div class="field"><label>Password</label><input id="reg-pass" type="password" placeholder="••••••••"/></div>
      <button class="btn-primary" onclick="doRegister()">Create Account</button>
    </div>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-logo"><span class="dot"></span>TaskFlow</div>
    <div class="header-right">
      <div class="view-toggle">
        <button class="view-btn active" id="grid-btn" onclick="setView('grid')" title="Grid view">⊞</button>
        <button class="view-btn" id="kanban-btn" onclick="setView('kanban')" title="Kanban view">☰</button>
      </div>
      <div class="user-pill">
        <div class="user-avatar" id="user-avatar">G</div>
        <span id="user-label">user</span>
      </div>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
  </header>

  <main>
    <!-- Stats -->
    <div class="stats" id="stats-row">
      <div class="stat-card" style="--card-accent:#7c6cfc">
        <div class="stat-label">Total Tasks</div>
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-icon">◈</div>
      </div>
      <div class="stat-card" style="--card-accent:#60a5fa">
        <div class="stat-label">To Do</div>
        <div class="stat-value" id="stat-todo">0</div>
        <div class="stat-icon">○</div>
      </div>
      <div class="stat-card" style="--card-accent:#fbbf24">
        <div class="stat-label">In Progress</div>
        <div class="stat-value" id="stat-progress">0</div>
        <div class="stat-icon">◑</div>
      </div>
      <div class="stat-card" style="--card-accent:#34d399">
        <div class="stat-label">Done</div>
        <div class="stat-value" id="stat-done">0</div>
        <div class="stat-icon">◉</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="filter-btn active" onclick="setFilter('ALL', this)">All</button>
        <button class="filter-btn" onclick="setFilter('TODO', this)">To Do</button>
        <button class="filter-btn" onclick="setFilter('IN_PROGRESS', this)">In Progress</button>
        <button class="filter-btn" onclick="setFilter('DONE', this)">Done</button>
      </div>
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Search tasks…" oninput="renderTasks()"/>
      </div>
      <button class="btn-new" onclick="openModal()">+ New Task</button>
    </div>

    <!-- Grid View -->
    <div class="tasks-grid" id="tasks-grid"></div>

    <!-- Kanban View -->
    <div class="kanban" id="kanban-view" style="display:none">
      <div class="kanban-col">
        <div class="kanban-header">
          <div class="kanban-title"><span style="color:var(--blue)">○</span> To Do <span class="kanban-count" id="k-todo-count">0</span></div>
        </div>
        <div class="kanban-body" id="k-todo"></div>
      </div>
      <div class="kanban-col">
        <div class="kanban-header">
          <div class="kanban-title"><span style="color:var(--yellow)">◑</span> In Progress <span class="kanban-count" id="k-progress-count">0</span></div>
        </div>
        <div class="kanban-body" id="k-progress"></div>
      </div>
      <div class="kanban-col">
        <div class="kanban-header">
          <div class="kanban-title"><span style="color:var(--green)">◉</span> Done <span class="kanban-count" id="k-done-count">0</span></div>
        </div>
        <div class="kanban-body" id="k-done"></div>
      </div>
    </div>
  </main>
</div>

<!-- TASK MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-title-text">New Task</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="task-id"/>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="task-title" placeholder="What needs to be done?"/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="task-desc" placeholder="Add more details…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select id="task-status">
          <option value="TODO">To Do</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="DONE">Done</option>
        </select>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="task-priority">
          <option value="LOW">Low</option>
          <option value="MEDIUM" selected>Medium</option>
          <option value="HIGH">High</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Due Date</label>
      <input type="datetime-local" id="task-due"/>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="save-btn" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <span class="toast-icon" id="toast-icon">✓</span>
  <span id="toast-msg">Saved!</span>
</div>

<script>
const API = '';  // same origin — Spring Boot serves this file
let token = localStorage.getItem('tf_token') || '';
let username = localStorage.getItem('tf_user') || '';
let tasks = [];
let currentFilter = 'ALL';
let currentView = 'grid';
let editingId = null;

// ── AUTH ──────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (i===0 && tab==='login')||(i===1 && tab==='register')));
  document.getElementById('login-form').style.display   = tab === 'login'    ? '' : 'none';
  document.getElementById('register-form').style.display= tab === 'register' ? '' : 'none';
  document.getElementById('auth-error').textContent = '';
}

async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!user || !pass) { setAuthError('Please fill in all fields.'); return; }
  const btn = document.querySelector('#login-form .btn-primary');
  btn.innerHTML = '<span class="loader"></span>'; btn.disabled = true;
  try {
    const r = await fetch(`${API}/api/auth/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:user, password:pass}) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Invalid credentials');
    token = d.token; username = user;
    localStorage.setItem('tf_token', token);
    localStorage.setItem('tf_user', username);
    enterApp();
  } catch(e) { setAuthError(e.message); }
  finally { btn.innerHTML = 'Sign In'; btn.disabled = false; }
}

async function doRegister() {
  const user  = document.getElementById('reg-user').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-pass').value;
  if (!user || !email || !pass) { setAuthError('Please fill in all fields.'); return; }
  const btn = document.querySelector('#register-form .btn-primary');
  btn.innerHTML = '<span class="loader"></span>'; btn.disabled = true;
  try {
    const r = await fetch(`${API}/api/auth/register`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:user, email, password:pass}) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Registration failed');
    token = d.token; username = user;
    localStorage.setItem('tf_token', token);
    localStorage.setItem('tf_user', username);
    enterApp();
  } catch(e) { setAuthError(e.message); }
  finally { btn.innerHTML = 'Create Account'; btn.disabled = false; }
}

function setAuthError(msg) { document.getElementById('auth-error').textContent = msg; }

function enterApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  document.getElementById('user-label').textContent = username;
  document.getElementById('user-avatar').textContent = username[0].toUpperCase();
  loadTasks();
}

function logout() {
  token = ''; username = '';
  localStorage.removeItem('tf_token');
  localStorage.removeItem('tf_user');
  tasks = [];
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').classList.remove('visible');
}

// ── API ───────────────────────────────────────────────────────
const auth = () => ({ 'Content-Type':'application/json', 'Authorization': `Bearer ${token}` });

async function loadTasks() {
  try {
    const r = await fetch(`${API}/api/tasks`, { headers: auth() });
    if (r.status === 401) { logout(); return; }
    tasks = await r.json();
    renderAll();
  } catch(e) { showToast('Failed to load tasks', 'error'); }
}

async function saveTask() {
  const title = document.getElementById('task-title').value.trim();
  if (!title) { showToast('Title is required', 'error'); return; }
  const payload = {
    title,
    description: document.getElementById('task-desc').value,
    status:      document.getElementById('task-status').value,
    priority:    document.getElementById('task-priority').value,
    dueDate:     document.getElementById('task-due').value || null
  };
  const btn = document.getElementById('save-btn');
  btn.innerHTML = '<span class="loader"></span>'; btn.disabled = true;
  try {
    const isEdit = !!editingId;
    const url = isEdit ? `${API}/api/tasks/${editingId}` : `${API}/api/tasks`;
    const r = await fetch(url, { method: isEdit ? 'PUT' : 'POST', headers: auth(), body: JSON.stringify(payload) });
    if (!r.ok) throw new Error('Save failed');
    closeModal();
    await loadTasks();
    showToast(isEdit ? 'Task updated!' : 'Task created!', 'success');
  } catch(e) { showToast(e.message, 'error'); }
  finally { btn.innerHTML = 'Save Task'; btn.disabled = false; }
}

async function deleteTask(id, e) {
  e.stopPropagation();
  if (!confirm('Delete this task?')) return;
  try {
    await fetch(`${API}/api/tasks/${id}`, { method:'DELETE', headers: auth() });
    await loadTasks();
    showToast('Task deleted', 'success');
  } catch(e) { showToast('Delete failed', 'error'); }
}

// ── RENDER ────────────────────────────────────────────────────
function filtered() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  return tasks.filter(t => {
    const matchFilter = currentFilter === 'ALL' || t.status === currentFilter;
    const matchSearch = !q || t.title.toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });
}

function renderAll() {
  updateStats();
  renderTasks();
}

function updateStats() {
  document.getElementById('stat-total').textContent    = tasks.length;
  document.getElementById('stat-todo').textContent     = tasks.filter(t=>t.status==='TODO').length;
  document.getElementById('stat-progress').textContent = tasks.filter(t=>t.status==='IN_PROGRESS').length;
  document.getElementById('stat-done').textContent     = tasks.filter(t=>t.status==='DONE').length;
}

function renderTasks() {
  const list = filtered();
  if (currentView === 'grid') renderGrid(list);
  else renderKanban(list);
}

function renderGrid(list) {
  const el = document.getElementById('tasks-grid');
  if (!list.length) { el.innerHTML = `<div class="empty"><div class="empty-icon">◈</div><h3>No tasks found</h3><p>Create one with the button above.</p></div>`; return; }
  el.innerHTML = list.map((t,i) => taskCardHTML(t,i)).join('');
}

function taskCardHTML(t, i) {
  const statusBadge = { TODO:'badge-todo', IN_PROGRESS:'badge-progress', DONE:'badge-done' }[t.status] || 'badge-todo';
  const statusLabel = { TODO:'To Do', IN_PROGRESS:'In Progress', DONE:'Done' }[t.status] || t.status;
  const prioBadge   = { LOW:'badge-low', MEDIUM:'badge-medium', HIGH:'badge-high' }[t.priority] || 'badge-medium';
  const dueHTML = t.dueDate ? `<span class="due-date ${isPast(t.dueDate) && t.status!=='DONE' ? 'overdue' : ''}">⏱ ${fmtDate(t.dueDate)}</span>` : '';
  return `
  <div class="task-card" style="animation-delay:${i*0.04}s" onclick="openModal(${t.id})">
    <div class="task-card-top">
      <div class="task-title ${t.status==='DONE'?'done':''}">${esc(t.title)}</div>
      <div class="task-actions">
        <button class="icon-btn" onclick="openModal(${t.id});event.stopPropagation()" title="Edit">✎</button>
        <button class="icon-btn del" onclick="deleteTask(${t.id},event)" title="Delete">✕</button>
      </div>
    </div>
    ${t.description ? `<div class="task-desc">${esc(t.description)}</div>` : ''}
    <div class="task-footer">
      <div class="task-tags">
        <span class="badge ${statusBadge}">${statusLabel}</span>
        <span class="badge ${prioBadge}">${t.priority||'MEDIUM'}</span>
      </div>
      ${dueHTML}
    </div>
  </div>`;
}

function renderKanban(list) {
  const cols = { TODO:[], IN_PROGRESS:[], DONE:[] };
  list.forEach(t => (cols[t.status] || cols.TODO).push(t));
  ['todo','progress','done'].forEach((key, i) => {
    const status = ['TODO','IN_PROGRESS','DONE'][i];
    const col = cols[status];
    document.getElementById(`k-${key}-count`).textContent = col.length;
    document.getElementById(`k-${key}`).innerHTML = col.length
      ? col.map(t => `
        <div class="kanban-card" onclick="openModal(${t.id})">
          <div class="kanban-card-title ${t.status==='DONE'?'done':''}">${esc(t.title)}</div>
          <div class="kanban-card-foot">
            <span class="badge ${{ LOW:'badge-low', MEDIUM:'badge-medium', HIGH:'badge-high' }[t.priority]||'badge-medium'}">${t.priority||'MEDIUM'}</span>
            ${t.dueDate ? `<span class="due-date ${isPast(t.dueDate)&&t.status!=='DONE'?'overdue':''}">⏱ ${fmtDate(t.dueDate)}</span>` : ''}
          </div>
        </div>`).join('')
      : `<div style="text-align:center;padding:40px 0;color:var(--text3);font-size:13px">Empty</div>`;
  });
}

// ── MODAL ─────────────────────────────────────────────────────
function openModal(id) {
  editingId = id || null;
  const task = id ? tasks.find(t => t.id === id) : null;
  document.getElementById('modal-title-text').textContent = task ? 'Edit Task' : 'New Task';
  document.getElementById('task-id').value       = task?.id || '';
  document.getElementById('task-title').value    = task?.title || '';
  document.getElementById('task-desc').value     = task?.description || '';
  document.getElementById('task-status').value   = task?.status || 'TODO';
  document.getElementById('task-priority').value = task?.priority || 'MEDIUM';
  document.getElementById('task-due').value      = task?.dueDate ? task.dueDate.slice(0,16) : '';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); editingId = null; }
document.getElementById('modal').addEventListener('click', e => { if(e.target === e.currentTarget) closeModal(); });

// ── FILTER / VIEW ─────────────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTasks();
}

function setView(v) {
  currentView = v;
  document.getElementById('tasks-grid').style.display  = v === 'grid'   ? '' : 'none';
  document.getElementById('kanban-view').style.display = v === 'kanban' ? '' : 'none';
  document.getElementById('grid-btn').classList.toggle('active',   v==='grid');
  document.getElementById('kanban-btn').classList.toggle('active', v==='kanban');
  renderTasks();
}

// ── UTILS ─────────────────────────────────────────────────────
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.className = `toast ${type}`;
  document.getElementById('toast-icon').textContent = type === 'success' ? '✓' : '✕';
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d) { return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function isPast(d) { return new Date(d) < new Date(); }

// ── INIT ──────────────────────────────────────────────────────
if (token) { enterApp(); }
document.getElementById('login-pass').addEventListener('keydown', e => e.key==='Enter' && doLogin());
document.getElementById('login-user').addEventListener('keydown', e => e.key==='Enter' && doLogin());
</script>
</body>
</html>
